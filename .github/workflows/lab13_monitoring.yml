
name: Lab 13 - End-to-End MLOps

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Kolkata"

jobs:
  mlops-monitoring:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python environment
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run MLOps monitoring trigger
        shell: bash
        run: |
          .venv/bin/python src/mlops_pipeline/12_monitor_trigger.py

      - name: Show monitoring result
        shell: bash
        run: |
          if [ -f outputs/monitoring/monitor_trigger_report.json ]; then
            cat outputs/monitoring/monitor_trigger_report.json
          else
            echo "Monitoring report was not generated."
          fi

      - name: Verify Kubernetes
        shell: bash
        run: |
          kubectl get deployment churn-api
          kubectl get pods
